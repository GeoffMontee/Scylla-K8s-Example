# Kubernetes access for the scripts that run inside the python-application pod.
#
# The pod runs as ${clusterName}-member (see _deploy_python-apps_k8s.bash) and
# the operator's aggregated `scyllacluster-member` ClusterRole already gives
# that account, in this namespace:
#
#   pods                get, list, patch, update, watch
#   services            get, list, patch, update, watch
#   secrets/configmaps  get, list, watch
#   statefulsets        get, list, patch, watch
#
# What follows is only what the in-pod scripts need on top of that.
# _deploy_python-apps_k8s.bash applies it with the pod, so normally there is
# nothing to do by hand. To apply it on its own:
#
#   kubectl -n scylla-dc1 apply -f python-k8s-access.yaml
#
# The namespace comes from `kubectl -n`, and a ServiceAccount subject with no
# namespace of its own defaults to the RoleBinding's - so the only thing to
# edit for a non-default install is the subject name, if clusterName is not
# "scylla". Remove it again with `kubectl -n scylla-dc1 delete -f` the same
# file, or `_deploy_python-apps_k8s.bash -d`.
#
# Note this account is shared with the ScyllaDB pods' own sidecars, so every
# rule here widens what they may do too. That is why the list is short, and why
# pods/exec is NOT in it: exec would be arbitrary command execution inside
# privileged ScyllaDB containers, and nothing here needs it - convert_to_tablets.py
# drives the migration over ScyllaDB's REST API on port 10000 instead. Reading
# the ScyllaDB CRs (scyllaclusters, scylladbdatacenters, ...) is left out for
# the same reason: add it deliberately if you write a script that wants it.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: python-k8s-access
rules:
  # Restart a ScyllaDB node from inside the cluster. This is the one rule the
  # scripts cannot work without: ScyllaDB's /storage_service/stop_daemon is in
  # its swagger but answers 500 "API call is not supported yet" (checked on
  # 2026.3.1), and nothing else in its REST API stops the process - so deleting
  # the pod is the only restart available to a script running in the cluster.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  # Read a node's logs when it does not come back from that restart. The
  # storage upgrade happens while ScyllaDB is offline during startup, so a node
  # that stays down has its reason in the `scylla` container's log.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # Why a recreated pod is not starting at all - image pulls, scheduling,
  # volumes. None of that shows up in the ScyllaDB API.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: python-k8s-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: python-k8s-access
subjects:
  - kind: ServiceAccount
    name: scylla-member
